name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install locked development and build environment
        run: uv sync --locked --all-groups --all-packages

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          tag_version = tag[1:]

          manifests = [
              Path("pyproject.toml"),
              Path("packaging/ga4adminctl/pyproject.toml"),
              Path("packaging/ga4datactl/pyproject.toml"),
              Path("packaging/gtmctl/pyproject.toml"),
          ]
          versions = []
          for manifest in manifests:
              with manifest.open("rb") as file:
                  project = tomllib.load(file)["project"]
              versions.append((project["name"], project["version"]))

          if any(version != tag_version for _, version in versions):
              raise SystemExit(
                  f"tag {tag_version} does not match package versions: {versions}"
              )
          if len({version for _, version in versions}) != 1:
              raise SystemExit(f"package versions are not synchronized: {versions}")
          print(f"validated release {tag}: {versions}")
          PY

      - name: Verify lockfile
        run: uv lock --check
      - name: Run tests and metadata checks
        run: uv run --locked --no-sync pytest
      - name: Lint
        run: uv run --locked --no-sync ruff check .
      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .
      - name: Type check
        run: uv run --locked --no-sync mypy

      - name: Build all distributions
        run: uv build --all-packages --offline --no-build-isolation --no-python-downloads --clear --out-dir dist
      - name: Inspect distributions
        run: uvx twine check dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
          merge-multiple: true
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: dist/
