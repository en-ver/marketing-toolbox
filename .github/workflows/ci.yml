name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install locked development and build environment
        run: uv sync --locked --all-groups --all-packages
      - name: Verify lockfile
        run: uv lock --check
      - name: Run tests
        run: uv run --locked --no-sync pytest
      - name: Lint
        run: uv run --locked --no-sync ruff check .
      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .
      - name: Type check
        run: uv run --locked --no-sync mypy
      - name: Build distributions offline
        run: uv build --all-packages --offline --no-build-isolation --no-python-downloads --out-dir dist

  oauth-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - name: Install locked development environment
        run: uv sync --locked --all-groups --all-packages
      - name: Run mocked native OAuth tests
        run: uv run --locked --no-sync pytest tests/test_oauth.py
