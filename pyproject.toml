[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packaging/*"]

[project]
name = "marketing-toolbox"
version = "0.6.0"
description = "Command-line tools for Google Analytics 4 and Google Tag Manager."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-analytics-admin==0.30.2",
    "google-analytics-data==0.23.3",
    "google-api-python-client==2.201.0",
    "google-auth[requests]==2.60.0",
    "google-auth-oauthlib==1.5.0",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "typer==0.27.3",
]

[project.scripts]
ga4datactl = "ga4datactl.cli:main"
ga4adminctl = "ga4adminctl.cli:main"
gtmctl = "gtmctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4datactl", "src/ga4adminctl", "src/gtmctl", "src/marketing_common"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/user", "/go.mod", "/go.sum", "/hugo.toml", "/dist", "/dist/**", "/.release-build-*", "/.release-build-*/**"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gtmctl.*"]
disable_error_code = ["func-returns-value"]

[dependency-groups]
build = [
    "hatchling==1.32.4",
]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.10",
    "types-protobuf>=7.34.1.20260518",
]
