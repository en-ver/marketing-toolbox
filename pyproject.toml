[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packaging/*"]

[project]
name = "marketing-toolbox"
version = "0.2.0"
description = "Command-line tools for Google Analytics 4 and Google Tag Manager."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-analytics-admin==0.30.1",
    "google-analytics-data==0.23.0",
    "google-api-python-client==2.198.0",
    "google-auth==2.56.2",
    "google-auth-oauthlib==1.2.4",
    "jsonschema==4.25.1",
    "keyring==25.6.0",
    "typer==0.27.0",
]

[project.scripts]
ga4datactl = "ga4datactl.cli:main"
ga4adminctl = "ga4adminctl.cli:main"
gtmctl = "gtmctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4datactl", "src/ga4adminctl", "src/gtmctl", "src/marketing_common", "src/marketing_toolbox"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gtmctl.*"]
disable_error_code = ["func-returns-value"]

[dependency-groups]
build = [
    "hatchling==1.31.0",
]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.0",
    "types-protobuf>=7.34.1.20260518",
]
